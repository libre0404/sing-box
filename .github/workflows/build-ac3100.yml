name: Build Sing-Box for RT-AC3100

on:
  workflow_dispatch: # 允許手動點擊按鈕觸發編譯

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sing-box source
        uses: actions/checkout@v4
        with:
          repository: 'SagerNet/sing-box'
          ref: 'v1.10.0'

      - name: Setup Go environment
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Compile tailored sing-box
        run: |
          env GOOS=linux GOARCH=arm GOARM=5 go build \
            -v \
            -tags "with_gvisor with_dhcp with_dns with_tun with_wireguard with_ech" \
            -ldflags "-s -w" \
            ./cmd/sing-box

      - name: Upload compiled binary
        uses: actions/upload-artifact@v4
        with:
          name: sing-box-rt-ac3100
          path: ./sing-box
