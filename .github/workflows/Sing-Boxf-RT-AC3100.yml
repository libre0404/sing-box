name: Build Sing-Box for RT-AC3100 (Max Compatibility)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sing-box source
        uses: actions/checkout@v4
        with:
          repository: 'SagerNet/sing-box'
          ref: 'stable'

      - name: Setup Go environment
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Compile tailored sing-box
        run: |
          # CGO_ENABLED=0 確保純靜態編譯，不依賴系統 glibc
          # GOARM=5 確保使用最安全的軟浮點相容模式，終結所有不相容報錯
          env CGO_ENABLED=0 GOOS=linux GOARCH=arm GOARM=5 go build \
            -v \
            -tags "with_gvisor with_dhcp with_dns with_tun with_utls with_clash_api" \
            -ldflags "-s -w" \
            -o sing-box \
            ./cmd/sing-box
      - name: Upload compiled binary
        uses: actions/upload-artifact@v4
        with:
          name: sing-box-rt-ac3100-purego
          path: ./sing-box
